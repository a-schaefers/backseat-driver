# Runs `npm run check` once a day on the newest Claude Code. The mod API can
# change between releases, so a red run here means "a new Claude Code broke
# something", not "main is broken": check.yml is the one pinned to the version
# the mod was last verified with. The README shows this run's status as a badge.
# After a merge armed by owner-merge.yml it is main's only run (a merge made
# with that job's token starts no push run of check.yml).

name: nightly

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Always the newest release.
      CLAUDE_CODE_VERSION: latest
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The kernel is PureScript. `npm run check` builds it and fails when the committed bundle,
      # plugin/core/kernel.js, is not what kernel/src builds. The compiler (fetched by pinned hash)
      # and spago's packages are kept between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            local/bin
            kernel/.spago
          key: kernel-${{ runner.os }}-${{ hashFiles('kernel/toolchain.json', 'kernel/spago.lock') }}
      - run: npm install -g @anthropic-ai/claude-code@$CLAUDE_CODE_VERSION
      - run: claude --version
      # The type check reads the mod API types, which Claude Code writes beside
      # the plugin whenever it loads it. Loading it in print mode is enough:
      # with no login the model call fails, after the types are written.
      - name: Write the mod API types
        run: |
          claude -p hi --plugin-dir ./plugin || true
          test -f plugin/.claude-plugin/types/claude-code/index.d.ts
          head -1 plugin/.claude-plugin/types/claude-code/index.d.ts
      - run: npm run check
