# Runs `npm run check` (kernel, validate, test, typecheck) on every push to main and
# every pull request, against the Claude Code version the mod was last
# verified with. nightly.yml runs the same check on the newest Claude Code.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep in step with "last verified against" in CLAUDE.md.
      CLAUDE_CODE_VERSION: '2.1.289'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The kernel is PureScript. `npm run check` builds it and fails when the committed bundle,
      # plugin/core/kernel.js, is not what kernel/src builds. The compiler (fetched by pinned hash)
      # and spago's packages are kept between runs.
      - uses: actions/cache@v4
        with:
          path: |
            local/bin
            kernel/.spago
          key: kernel-${{ runner.os }}-${{ hashFiles('kernel/toolchain.json', 'kernel/spago.lock') }}
      - run: npm install -g @anthropic-ai/claude-code@$CLAUDE_CODE_VERSION
      - run: claude --version
      # The type check reads the mod API types, which Claude Code writes beside
      # the plugin whenever it loads it. Loading it in print mode is enough:
      # with no login the model call fails, after the types are written.
      - name: Write the mod API types
        run: |
          claude -p hi --plugin-dir ./plugin || true
          test -f plugin/.claude-plugin/types/claude-code/index.d.ts
          head -1 plugin/.claude-plugin/types/claude-code/index.d.ts
      - run: npm run check
